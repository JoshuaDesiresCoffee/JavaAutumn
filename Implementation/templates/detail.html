<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ entityName }} Detail — JavaAutumn</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
    <style>
        .detail-card {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .detail-image {
            width: 300px;
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
        }
        .detail-info {
            flex: 1;
            min-width: 300px;
        }
        .detail-table {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 16px;
        }
        .detail-table th, .detail-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .detail-table th {
            width: 140px;
            background: rgba(0,0,0,0.3);
            color: var(--accent-orange);
        }
        .detail-title-name {
            color: var(--text-main);
        }
        .action-bar {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }
        .detail-back-btn {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
        }
        .detail-bio-wrap {
            margin-top: 12px;
            text-align: center;
        }
        .detail-bio-link {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        .detail-edit-link {
            background: var(--accent-orange);
            color: white;
            border-color: transparent;
        }
        .detail-edit-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="table-container">
        <h1>{{ entityName }}: <span class="detail-title-name">{{ displayedAs }}</span></h1>

        <div class="detail-card">
            <div>
                {{#if pictureUrl}}
                <img src="{{ pictureUrl }}" class="detail-image" alt="" referrerpolicy="no-referrer">
                {{/if}}
                {{#if bioUrl}}
                <div class="detail-bio-wrap">
                    <a href="{{ bioUrl }}" target="_blank" rel="noopener noreferrer"
                       class="table-link detail-bio-link">Read Biography ↗</a>
                </div>
                {{/if}}
            </div>

            <div class="detail-info">
                <table class="detail-table">
                    <tbody>
                        {{#each fields}}
                        <tr>
                            <th>{{ key }}</th>
                            <td>{{ value }}</td>
                        </tr>
                        {{/each}}
                    </tbody>
                </table>

                <div class="action-bar">
                    <button type="button" class="detail-back-btn" onclick="window.history.back()">← Go Back</button>
                    {{#if showArtworkEdit}}
                    <a href="{{ artworkEditUrl }}" class="table-link detail-edit-link">✏️ Edit</a>
                    {{/if}}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
