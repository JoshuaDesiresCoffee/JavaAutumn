<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Artworks</title>
        <link rel="stylesheet" href="/static/style.css">
        <script src="/static/script.js" defer></script>
    </head>
    <body>
        <h1>Artworks</h1>

        <div class="buttons" style="display:none;"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Artwork</th>
                        <th>Material</th>
                        <th>Artist</th>
                        <th>Provenance</th>
                        <th data-min-role="AUTH">Actions</th>
                        <th data-min-role="AUTH">Rate</th>
                    </tr>
                </thead>
                <tbody>
                    {{#each artworks}}
                        <tr>
                            <td>{{ id }}</td>
                            <td class="truncate-cell" title="{{ displayedAs }}">{{ displayedAs }}</td>
                            <td class="truncate-cell" title="{{ material }}">{{ material }}</td>
                            <td class="truncate-cell" title="{{ artist.displayedAs }}">{{ artist.displayedAs }}</td>
                            <td class="truncate-cell" title="{{ provenance.displayedAs }}">{{ provenance.displayedAs }}</td>
                            <td data-min-role="AUTH">
                                <form method="GET" action="/artworks/edit" style="display:inline;">
                                    <input type="hidden" name="id" value="{{ id }}">
                                    <button type="submit" style="background: var(--accent-gold); color: #1e1611;">Edit</button>
                                </form>
                                <form method="POST" action="/artworks/delete" style="display:inline;">
                                    <input type="hidden" name="id" value="{{ id }}">
                                    <button type="submit" class="btn-danger">Delete</button>
                                </form>
                            </td>
                            <td data-min-role="AUTH">
                                <form method="POST" action="/ratings/create" style="display:inline;">
                                    <input type="hidden" name="artworkId" value="{{ id }}">
                                    <select name="userId" required>
                                        <option value="">Rate as...</option>
                                        {{#each users}}
                                            <option value="{{ id }}">{{ name }}</option>
                                        {{/each}}
                                    </select>
                                    <select name="starsId" required>
                                        <option value="">Stars...</option>
                                        {{#each starsList}}
                                            <option value="{{ id }}">{{ displayedAs }}</option>
                                        {{/each}}
                                    </select>
                                    <button type="submit">Rate</button>
                                </form>
                            </td>
                        </tr>
                    {{/each}}
                </tbody>
            </table>
        </div>

        <div class="form-container" data-min-role="AUTH">
            <h2>Add New Artwork</h2>
            <form method="POST" action="/artworks/create">
                <input type="text" name="displayedAs" placeholder="Artwork Title" required>
                <input type="text" name="material" placeholder="Material" required>
                
                <select name="artistId" required>
                    <option value="">Select Artist...</option>
                    {{#each artists}}
                        <option value="{{ id }}">{{ displayedAs }}</option>
                    {{/each}}
                </select>

                <select name="provenanceId" required>
                    <option value="">Select Provenance...</option>
                    {{#each provenances}}
                        <option value="{{ id }}">{{ displayedAs }}</option>
                    {{/each}}
                </select>

                <button type="submit">Create Artwork</button>
            </form>
        </div>
    </body>
</html>
