<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratings — JavaAutumn</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <h1>Ratings</h1>

    <div class="buttons" style="display:none;"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Displayed As</th>
                    <th>Artwork</th>
                    <th>Stars</th>
                    <th>User</th>
                    <th data-min-role="AUTH">Actions</th>
                </tr>
            </thead>
            <tbody>
                {{#each ratings}}
                <tr>
                    <td>{{ id }}</td>
                    <td class="truncate-cell" title="{{ displayedAs }}">{{ displayedAs }}</td>
                    <td class="truncate-cell" title="{{ artwork.displayedAs }}">{{ artwork.displayedAs }}</td>
                    <td style="font-size:1.2rem; letter-spacing:2px;">{{ stars.displayedAs }}</td>
                    <td>{{ user.name }}</td>
                    <td data-min-role="AUTH">
                        <form method="POST" action="/ratings/delete" style="display:inline;">
                            <input type="hidden" name="id" value="{{ id }}">
                            <button type="submit" class="btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                {{/each}}
            </tbody>
        </table>
    </div>

    <div class="form-container" data-min-role="AUTH">
        <h2>Add New Rating</h2>
        <form method="POST" action="/ratings/create">
            <input type="text" name="displayedAs" placeholder="Label (optional)">

            <select name="artworkId" required>
                <option value="">Select Artwork...</option>
                {{#each artworks}}
                    <option value="{{ id }}">{{ displayedAs }}</option>
                {{/each}}
            </select>

            <select name="starsId" required>
                <option value="">Select Stars...</option>
                {{#each starsList}}
                    <option value="{{ id }}">{{ displayedAs }}</option>
                {{/each}}
            </select>

            <select name="userId" required>
                <option value="">Rate as User...</option>
                {{#each users}}
                    <option value="{{ id }}">{{ name }}</option>
                {{/each}}
            </select>

            <button type="submit">Submit Rating</button>
        </form>
    </div>
</body>
</html>
